name: Link check

on:
  push:
    branches: [main]
    paths: ["**.md", "docs/**", ".github/workflows/link-check.yml"]
  pull_request:
    branches: [main]
    paths: ["**.md", "docs/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --exclude-mail
            --exclude "localhost" --exclude "claude.ai" --exclude "athene"
            "**/*.md"
          fail: false
